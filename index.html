<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>NOVA BREAKER 3D — casse-briques néon</title>
<meta name="description" content="Casse-briques néon en 3D : 6 niveaux, power-ups, combos. Jouable dans le navigateur, PC et mobile." />
<meta property="og:title" content="NOVA BREAKER 3D" />
<meta property="og:description" content="Casse-briques néon en 3D, jouable directement dans le navigateur." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#03050c" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#2ee6ff; --mag:#ff4fd8; --amber:#ffb347; --green:#5dff8f; --red:#ff5d7a;
    --bg:#03050c; --panel:rgba(6,12,26,.72); --line:rgba(90,200,255,.22);
    --txt:#dff3ff; --dim:#8fa9c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  .ui{position:fixed;z-index:10}

  /* ---------- HUD ---------- */
  #hud{top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;pointer-events:none;
    background:linear-gradient(180deg,rgba(3,5,12,.82) 0%,rgba(3,5,12,.35) 60%,transparent 100%)}
  .stat{display:flex;flex-direction:column;gap:1px;min-width:56px}
  .stat .k{font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;font-weight:600}
  .stat .v{font-family:'Orbitron',monospace;font-size:clamp(15px,2.4vw,22px);font-weight:700;line-height:1.05;
    color:#fff;text-shadow:0 0 12px rgba(46,230,255,.65)}
  #statHi .v{color:var(--amber);text-shadow:0 0 12px rgba(255,179,71,.55)}
  #statLevel .v{color:var(--mag);text-shadow:0 0 12px rgba(255,79,216,.55)}
  #lives{display:flex;gap:5px;align-items:center;min-height:22px}
  .heart{width:13px;height:13px;background:var(--red);display:block;
    clip-path:polygon(50% 100%,0 38%,0 12%,25% 0,50% 18%,75% 0,100% 12%,100% 38%);
    box-shadow:0 0 12px rgba(255,93,122,.9)}
  #combo{font-family:'Orbitron',monospace;font-size:clamp(16px,2.6vw,24px);font-weight:900;color:var(--dim);
    min-width:52px;text-align:right;transition:transform .12s ease}
  #combo.hot{color:var(--green);text-shadow:0 0 16px rgba(93,255,143,.85);transform:scale(1.12)}
  .btns{display:flex;gap:6px;pointer-events:auto}
  .icb{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--txt);font-size:15px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);
    transition:.16s}
  .icb:hover{border-color:var(--cyan);color:#fff;box-shadow:0 0 18px rgba(46,230,255,.35)}
  .icb.off{opacity:.45}

  /* ---------- toast ---------- */
  #toast{left:50%;bottom:16%;transform:translateX(-50%) scale(.85);opacity:0;pointer-events:none;
    font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(18px,4.2vw,34px);letter-spacing:.06em;
    text-shadow:0 0 22px currentColor,0 0 44px currentColor;transition:opacity .18s,transform .18s;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1)}

  /* ---------- incitation à passer en paysage (portrait mobile) ---------- */
  #rotateHint{left:50%;top:calc(50% + env(safe-area-inset-top));transform:translate(-50%,-50%);display:none;
    padding:9px 16px;border-radius:99px;border:1px solid rgba(46,230,255,.35);background:rgba(4,10,22,.82);
    color:var(--cyan);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-align:center;max-width:88vw;
    backdrop-filter:blur(6px);pointer-events:none;text-shadow:0 0 12px rgba(46,230,255,.6);z-index:12}
  #rotateHint.show{display:block;animation:hintPulse 2.6s ease-in-out infinite}
  @keyframes hintPulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- hint bas ---------- */
  #hint{left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font-size:12px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;pointer-events:none;
    text-align:center;width:100%;padding:0 12px}
  #hint b{color:var(--cyan);font-weight:700}

  /* ---------- overlay ---------- */
  #overlay{inset:0;display:none;place-items:center;padding:20px;
    background:radial-gradient(120% 90% at 50% 40%,rgba(6,14,32,.72) 0%,rgba(2,4,10,.93) 70%);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  #overlay.show{display:grid}
  .card{width:min(560px,94vw);text-align:center;padding:clamp(22px,4.4vw,38px) clamp(18px,4vw,34px);
    border:1px solid var(--line);border-radius:22px;background:linear-gradient(165deg,rgba(10,20,42,.86),rgba(4,8,18,.92));
    box-shadow:0 0 60px rgba(46,230,255,.16),inset 0 1px 0 rgba(255,255,255,.07);position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;inset:-40% -10% auto;height:180px;
    background:radial-gradient(60% 100% at 50% 0,rgba(255,79,216,.22),transparent 70%);pointer-events:none}
  #ovTitle{font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(28px,6.4vw,50px);line-height:1;
    letter-spacing:.04em;margin:0;color:#fff;
    text-shadow:0 0 18px rgba(46,230,255,.9),0 0 46px rgba(255,79,216,.55)}
  #ovSub{font-family:'Orbitron',monospace;font-weight:700;font-size:clamp(14px,3vw,20px);letter-spacing:.42em;
    margin:8px 0 0;color:var(--mag);text-shadow:0 0 18px rgba(255,79,216,.75)}
  #ovHint{margin:16px 0 0;color:var(--dim);font-size:15px;line-height:1.5}
  .keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 4px}
  .kb{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--dim);
    background:rgba(8,16,32,.6);letter-spacing:.04em}
  .kb b{color:var(--cyan);font-weight:700}
  .cta{margin-top:24px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .big{font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(16px,3.4vw,20px);letter-spacing:.16em;
    padding:15px 44px;border-radius:14px;cursor:pointer;color:#02121a;border:0;
    background:linear-gradient(100deg,var(--cyan),#7ef9ff 40%,var(--mag));
    box-shadow:0 0 32px rgba(46,230,255,.5),0 0 60px rgba(255,79,216,.28);transition:.18s}
  .big:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 46px rgba(46,230,255,.75),0 0 90px rgba(255,79,216,.4)}
  .big:active{transform:translateY(0) scale(.99)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .ghost{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:9px 16px;border-radius:10px;cursor:pointer;color:var(--dim);background:transparent;
    border:1px solid var(--line);transition:.16s}
  .ghost:hover{color:#fff;border-color:var(--cyan)}
  #badge3d{position:absolute;top:14px;right:16px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
    letter-spacing:.22em;color:var(--green);border:1px solid rgba(93,255,143,.4);border-radius:99px;padding:4px 10px;
    background:rgba(93,255,143,.08);text-shadow:0 0 12px rgba(93,255,143,.6)}
  #loading{inset:0;display:grid;place-items:center;background:var(--bg);z-index:30;
    font-family:'Orbitron',monospace;letter-spacing:.3em;color:var(--cyan);font-size:13px}
  #loading.hide{display:none}
  @media (max-width:640px){
    .stat{min-width:44px}
    #hint{font-size:10.5px}
    .keys{gap:6px}
  }
  @media (max-height:460px){
    .keys{display:none}
    .cta{margin-top:14px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="loading" class="ui">CHARGEMENT…</div>

<div id="hud" class="ui">
  <div class="stat" id="statScore"><span class="k">Score</span><span class="v" id="score">0</span></div>
  <div class="stat" id="statHi"><span class="k">Record</span><span class="v" id="hi">0</span></div>
  <div class="stat" id="statLevel"><span class="k">Niveau</span><span class="v" id="level">1/6</span></div>
  <div class="stat"><span class="k">Vies</span><div id="lives"></div></div>
  <div id="combo"></div>
  <div class="btns">
    <button class="icb" id="btnPause" title="Pause (P)" aria-label="Pause">❚❚</button>
    <button class="icb" id="btnSound" title="Son (M)" aria-label="Son">🔊</button>
    <button class="icb" id="btnRestart" title="Recommencer" aria-label="Recommencer">⟲</button>
  </div>
</div>

<div id="toast" class="ui"></div>
<div id="rotateHint" class="ui">↻ Tourne ton téléphone en paysage pour une meilleure vue</div>
<div id="hint" class="ui">Souris / doigt pour déplacer · <b>Espace</b> ou clic pour lancer · <b>P</b> pause · <b>M</b> son</div>

<div id="overlay" class="ui" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="card">
    <div id="badge3d">3D</div>
    <h1 id="ovTitle">NOVA BREAKER</h1>
    <div id="ovSub">3D</div>
    <p id="ovHint"></p>
    <div class="keys">
      <span class="kb"><b>Souris / ←→</b> déplacer</span>
      <span class="kb"><b>Espace / clic</b> lancer</span>
      <span class="kb"><b>P</b> pause</span>
      <span class="kb"><b>M</b> son</span>
    </div>
    <div class="cta">
      <button class="big" id="ovBtn" data-action="menu">JOUER</button>
      <div class="row">
        <button class="ghost" id="btnPlay">Nouvelle partie</button>
        <button class="ghost" id="btn2d">Version 2D</button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module" src="./game.js"></script>
<script>
  window.addEventListener('load', function () {
    var t = setTimeout(function () {
      var l = document.getElementById('loading');
      if (l) l.classList.add('hide');
    }, 6000);
    var iv = setInterval(function () {
      if (window.NOVA) {
        clearInterval(iv); clearTimeout(t);
        var l = document.getElementById('loading');
        if (l) l.classList.add('hide');
      }
    }, 60);
  });
  window.addEventListener('error', function (e) {
    var l = document.getElementById('loading');
    if (l && !window.NOVA) {
      l.textContent = 'ERREUR : ' + (e.message || 'chargement impossible');
      l.style.color = '#ff5d7a';
    }
  });
</script>
</body>
</html>
